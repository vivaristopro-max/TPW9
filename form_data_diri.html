<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        :root {
            --blue: #1677e8;
            --blue-dark: #0f5fbe;
            --text: #202124;
            --muted: #5f6368;
            --border: #d9dee7;
            --surface: #ffffff;
            --background: #f5f7fb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 36px 18px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        .page { width: 100%; max-width: 560px; margin: 0 auto; }

        .brand {
            margin-bottom: 18px;
            color: #566274;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-align: center;
            text-transform: uppercase;
        }

        .brand-line {
            width: 100%;
            height: 4px;
            margin-top: 12px;
            border-radius: 4px;
            background: var(--blue);
        }

        .card {
            padding: 28px 30px 30px;
            border: 1px solid #e5e9f0;
            border-radius: 10px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(32, 55, 90, 0.07);
        }

        h1 { margin: 0 0 22px; font-size: 24px; line-height: 1.25; }

        .field { margin-bottom: 17px; }
        .field-label, legend {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        input[type="text"], input[type="date"] {
            display: block;
            width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #fff;
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        input:focus-visible {
            border-color: var(--blue);
            outline: 3px solid rgba(22, 119, 232, 0.14);
        }

        fieldset { margin: 0 0 21px; padding: 0; border: 0; }
        .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
        .choice {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #333b48;
            font-size: 14px;
            cursor: pointer;
        }
        .choice input { width: 15px; height: 15px; margin: 0; accent-color: var(--blue); }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            height: 40px;
            padding: 0 19px;
            border: 0;
            border-radius: 5px;
            background: var(--blue);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
            cursor: pointer;
        }
        button:hover { background: var(--blue-dark); }
        button:focus-visible { outline: 3px solid rgba(22, 119, 232, 0.25); outline-offset: 2px; }

        .hint { margin: 16px 0 0; color: var(--muted); font-size: 12px; }

        @media (max-width: 480px) {
            body { padding: 22px 12px; }
            .card { padding: 23px 19px; }
            h1 { font-size: 21px; }
            .choices { grid-template-columns: 1fr; gap: 11px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="brand">
            Laboratorium Praktikum Informatika
            <div class="brand-line"></div>
        </div>

        <section class="card" aria-labelledby="page-title">
            <h1 id="page-title">Formulir Data Diri</h1>

            <form action="proses_data_diri.php" method="POST">
                <div class="field">
                    <label class="field-label" for="nama_lengkap">Nama Lengkap:</label>
                    <input
                        type="text"
                        id="nama_lengkap"
                        name="nama_lengkap"
                        maxlength="100"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="field">
                    <label class="field-label" for="tanggal_lahir">Tanggal Lahir:</label>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
                </div>

                <fieldset>
                    <legend>Hobi:</legend>
                    <div class="choices">
                        <label class="choice"><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                        <label class="choice"><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                        <label class="choice"><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                        <label class="choice"><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
                    </div>
                </fieldset>

                <button type="submit">Kirim</button>
                <p class="hint">Pastikan nama dan tanggal lahir sudah benar sebelum mengirim formulir.</p>
            </form>
        </section>
    </main>
</body>
</html>
